名称: Django CI

触发条件:
  push:
    分支: [ "main" ]
  pull_request:
    分支: [ "main" ]

作业:
  build:

运行环境: uubuntu-latest
    策略:
      max-parallel: 4
      matrix:
        Python 版本: [3.7, 3.8, 3.9]

步骤:
    - uses: actions/checkout@v4
    - 名称: 设置 Python ${{ matrix.python-version }}
      使用: actions/setup-python@v3
      with:
        Python 版本: ${{ matrix.python-version }}
    - name: 安装依赖项
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - 名称: 运行测试
      run: |
        python manage.py test
